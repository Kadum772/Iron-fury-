<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >
  <title>IRON FURY</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <!-- Background -->
  <div class="background-glow"></div>
  <div class="scanlines"></div>

  <!-- HUD -->
  <div id="hud">

    <div class="fighter-card player-card">
      <div class="name-row">
        <span>PLAYER</span>
        <b>FURY</b>
      </div>

      <div class="health-frame">
        <div id="player-health"></div>
      </div>

      <div class="energy-frame">
        <div id="player-energy"></div>
      </div>
    </div>

    <div id="round">
      <span>ROUND</span>
      <strong id="timer">60</strong>
    </div>

    <div class="fighter-card enemy-card">
      <div class="name-row">
        <span>CPU</span>
        <b>RIVAL</b>
      </div>

      <div class="health-frame">
        <div id="enemy-health"></div>
      </div>

      <div class="energy-frame">
        <div id="enemy-energy"></div>
      </div>
    </div>

  </div>

  <!-- Arena -->
  <div id="arena">

    <div class="city-light light-one"></div>
    <div class="city-light light-two"></div>
    <div class="city-light light-three"></div>

    <div class="arena-floor">
      <div class="floor-grid"></div>
    </div>

    <!-- PLAYER -->
    <div id="player" class="fighter player">

      <div class="fighter-shadow"></div>

      <div class="head">
        <div class="visor"></div>
      </div>

      <div class="torso">
        <div class="chest-core"></div>
      </div>

      <div class="arm left-arm"></div>
      <div class="arm right-arm"></div>

      <div class="leg left-leg"></div>
      <div class="leg right-leg"></div>

    </div>

    <!-- ENEMY -->
    <div id="enemy" class="fighter enemy">

      <div class="fighter-shadow"></div>

      <div class="head">
        <div class="visor"></div>
      </div>

      <div class="torso">
        <div class="chest-core"></div>
      </div>

      <div class="arm left-arm"></div>
      <div class="arm right-arm"></div>

      <div class="leg left-leg"></div>
      <div class="leg right-leg"></div>

    </div>

    <div id="announcement"></div>

  </div>

  <!-- MOBILE CONTROLS -->
  <div id="controls">

    <div id="joystick">
      <div id="joystick-ring"></div>
      <div id="joystick-knob"></div>
    </div>

    <div id="action-buttons">

      <button id="jump" class="control jump">
        <span>J</span>
      </button>

      <button id="dash" class="control dash">
        <span>D</span>
      </button>

      <button id="special" class="control special">
        <span>F</span>
      </button>

      <button id="punch" class="control punch">
        <span>P</span>
      </button>

      <button id="kick" class="control kick">
        <span>K</span>
      </button>

      <button id="block" class="control block">
        <span>B</span>
      </button>

    </div>

  </div>

</div>

<script src="game.js"></script>

</body>
</html>
