<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Stick Fury</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="game">

    <div id="hud">
      <div class="fighter-name">PLAYER</div>
      <div class="health">
        <div id="player-health"></div>
      </div>

      <div id="timer">60</div>

      <div class="fighter-name enemy-name">ENEMY</div>
      <div class="health enemy-health">
        <div id="enemy-health"></div>
      </div>
    </div>

    <div id="arena">

      <div id="player" class="fighter player">
        <div class="head"></div>
        <div class="body"></div>
        <div class="arm arm-left"></div>
        <div class="arm arm-right"></div>
        <div class="leg leg-left"></div>
        <div class="leg leg-right"></div>
      </div>

      <div id="enemy" class="fighter enemy">
        <div class="head"></div>
        <div class="body"></div>
        <div class="arm arm-left"></div>
        <div class="arm arm-right"></div>
        <div class="leg leg-left"></div>
        <div class="leg leg-right"></div>
      </div>

      <div id="message"></div>

    </div>

    <!-- MOBILE CONTROLS -->

    <div id="controls">

      <div id="joystick">
        <div id="joystick-knob"></div>
      </div>

      <div id="buttons">

        <button id="jump">⬆</button>
        <button id="dash">💨</button>
        <button id="punch">👊</button>

        <button id="kick">🦵</button>
        <button id="block">🛡️</button>
        <button id="special">⚡</button>

      </div>

    </div>

  </div>

  <script src="game.js"></script>

</body>
</html>
