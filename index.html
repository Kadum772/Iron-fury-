<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Iron Fury</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <!-- HUD -->
  <div id="hud">

    <div class="name player-name">PLAYER</div>
    <div class="name enemy-name">ENEMY</div>

    <div class="health-bar player-bar">
      <div id="player-health"></div>
    </div>

    <div class="health-bar enemy-bar">
      <div id="enemy-health"></div>
    </div>

    <div id="timer">60</div>

  </div>

  <!-- ARENA -->
  <div id="arena">

    <div id="player" class="fighter player">

      <div class="head"></div>
      <div class="body"></div>

      <div class="arm left-arm"></div>
      <div class="arm right-arm"></div>

      <div class="leg left-leg"></div>
      <div class="leg right-leg"></div>

    </div>

    <div id="enemy" class="fighter enemy">

      <div class="head"></div>
      <div class="body"></div>

      <div class="arm left-arm"></div>
      <div class="arm right-arm"></div>

      <div class="leg left-leg"></div>
      <div class="leg right-leg"></div>

    </div>

    <div id="message"></div>

  </div>

  <!-- MOBILE CONTROLS -->
  <div id="controls">

    <div id="joystick">
      <div id="joystick-knob"></div>
    </div>

    <div id="buttons">

      <button id="jump">↑</button>
      <button id="dash">⚡</button>
      <button id="punch">👊</button>

      <button id="kick">🦵</button>
      <button id="block">🛡</button>
      <button id="special">★</button>

    </div>

  </div>

</div>

<script src="game.js"></script>

</body>
</html>
