<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>IRON FURY</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <div class="top">
    <div class="fighter">
      <div class="name">KAI</div>
      <div class="bar"><div id="playerHealth"></div></div>
      <div class="power"><div id="playerPower"></div></div>
    </div>

    <div class="timer" id="timer">60</div>

    <div class="fighter enemy">
      <div class="name">ROCCO</div>
      <div class="bar"><div id="enemyHealth"></div></div>
      <div class="power"><div id="enemyPower"></div></div>
    </div>
  </div>

  <div id="arena">

    <div id="player" class="character player">
      <div class="head"></div>
      <div class="body"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
    </div>

    <div id="enemy" class="character enemy-character">
      <div class="head"></div>
      <div class="body"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
    </div>

  </div>

  <div id="message">FIGHT!</div>

  <div class="controls">

    <div class="movement">
      <button onclick="moveLeft()">◀</button>
      <button onclick="moveRight()">▶</button>
    </div>

    <div class="attacks">
      <button onclick="punch()">👊</button>
      <button onclick="kick()">🦵</button>
      <button onclick="block()">🛡️</button>
      <button class="special" onclick="special()">⚡</button>
    </div>

  </div>

  <div id="gameOver" class="hidden">
    <h1 id="resultText">YOU WIN!</h1>
    <button onclick="restartGame()">PLAY AGAIN</button>
  </div>

</div>

<script src="game.js"></script>

</body>
</html>
