<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>IRON FURY</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <div class="scanlines"></div>

  <!-- TOP HUD -->
  <header id="hud">

    <div class="fighter-info player-info">
      <span class="label">PLAYER</span>
      <strong id="playerName">FURY</strong>

      <div class="bar">
        <div id="playerHP"></div>
      </div>

      <div class="energy">
        <div id="playerEnergy"></div>
      </div>
    </div>

    <div id="round">
      <small>ROUND</small>
      <strong id="timer">60</strong>
    </div>

    <div class="fighter-info enemy-info">
      <span class="label">CPU</span>
      <strong>RIVAL</strong>

      <div class="bar">
        <div id="enemyHP"></div>
      </div>

      <div class="energy enemy-energy">
        <div id="enemyEnergy"></div>
      </div>
    </div>

  </header>

  <!-- ARENA -->
  <main id="arena">

    <div class="moon"></div>
    <div class="horizon"></div>

    <div class="platform">
      <div class="grid"></div>
    </div>

    <!-- PLAYER -->
    <div id="player" class="fighter player">

      <div class="shadow"></div>

      <div class="head">
        <div class="visor"></div>
      </div>

      <div class="torso">
        <div class="core"></div>
      </div>

      <div class="arm arm1"></div>
      <div class="arm arm2"></div>

      <div class="leg leg1"></div>
      <div class="leg leg2"></div>

    </div>

    <!-- ENEMY -->
    <div id="enemy" class="fighter enemy">

      <div class="shadow"></div>

      <div class="head">
        <div class="visor"></div>
      </div>

      <div class="torso">
        <div class="core"></div>
      </div>

      <div class="arm arm1"></div>
      <div class="arm arm2"></div>

      <div class="leg leg1"></div>
      <div class="leg leg2"></div>

    </div>

    <div id="announcement"></div>

  </main>

  <!-- CONTROLS -->
  <section id="controls">

    <div id="joystick">
      <div id="stick"></div>
    </div>

    <div id="actions">

      <button id="jump" class="action jump">J</button>
      <button id="dash" class="action dash">D</button>

      <button id="attack" class="action attack">P</button>
      <button id="kick" class="action kick">K</button>

      <button id="block" class="action block">B</button>
      <button id="special" class="action special">F</button>

    </div>

  </section>

</div>

<script src="game.js"></script>

</body>
</html>
